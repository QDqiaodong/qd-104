services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8083:8080"
    volumes:
      - ./data:/app/data
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:sqlite:/app/data/travel_footprint.db
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8088:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: travel-network
